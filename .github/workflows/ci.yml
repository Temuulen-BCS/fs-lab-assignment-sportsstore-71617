name: SportsStore CI

'on':
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./SportsSln.sln

      - name: Build solution
        run: dotnet build ./SportsSln.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ./SportsSln.sln --configuration Release
        
      - name: Run tests with coverage
        run: dotnet test --collect:"XPlat Code Coverage"
      
      - name: Install report generator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      
      - name: Generate report
        run: reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage-report
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
